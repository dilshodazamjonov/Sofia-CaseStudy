[project]
name = "sofia-task"
version = "0.1.0"
description = "Expected sales index of a proposed Safia branch from its location (Safia ML researcher case study)"
readme = "README.md"
authors = [
    { name = "Dilshod A'zamjonov", email = "d.azamjonov@newuu.uz" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "osmium>=4.3.1",
    "pandas>=3.0.6",
    "pyrosm>=0.18.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
